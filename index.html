<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1a;--card:#3a1626;--ink:#ffeef4;--mute:#d8a9ba;--pri:#ff6b9d;--soft:#5a2238;--ok:#4fd1bd;--warn:#f0b24a;--bad:#ff8a80;--line:#5c2a40}}
:root[data-theme="dark"]{--bg:#2a0f1a;--card:#3a1626;--ink:#ffeef4;--mute:#d8a9ba;--pri:#ff6b9d;--soft:#5a2238;--ok:#4fd1bd;--warn:#f0b24a;--bad:#ff8a80;--line:#5c2a40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Madurai",system-ui,sans-serif;font-size:16px;line-height:1.5}
.app{max-width:460px;margin:0 auto;padding:14px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-size:28px;font-weight:700;line-height:1;display:flex;align-items:flex-end}
.brand svg{margin-left:1px;margin-bottom:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;color:var(--mute);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.lang button.on{background:var(--pri);color:#fff}
.hi{font-size:24px;font-weight:700;margin:4px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;scroll-margin-top:8px}
h2{font-size:18px;margin:0 0 8px}
.sub,.note{font-size:13px;color:var(--mute)}
.dial{display:flex;align-items:center;gap:16px}
.big{font-size:28px;font-weight:700;line-height:1.1}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:500;background:var(--soft);color:var(--pri)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input[type=text],input[type=date],input[type=tel],input[type=email]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.dt{display:flex;gap:8px;align-items:stretch}
.dt input[type=text]{flex:1;min-width:0;width:auto}
.pk{position:relative;flex:none;width:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;cursor:pointer}
.pk input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.opt{display:grid;gap:8px}
.opt.c3{grid-template-columns:repeat(3,1fr)}.opt.c4{grid-template-columns:repeat(4,1fr)}.opt.c5{grid-template-columns:repeat(3,1fr)}
.opt button,.mc button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 4px;font:inherit;font-size:14px;cursor:pointer}
.opt button.on,.mc button.on{border-color:var(--pri);background:var(--soft)}
.mc{display:flex;flex-wrap:wrap;gap:8px}.mc button{padding:6px 12px;border-radius:99px}
.cta{width:100%;border:0;background:var(--pri);color:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none}
.cta.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.timer{font-size:24px;font-weight:700}.timer.late{color:var(--bad)}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;margin-bottom:8px}
.steps li:before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--pri);margin-top:8px}
.tag{font-size:13px;font-weight:700;color:var(--ok);margin-top:10px}.tag.x{color:var(--bad)}
.alert{border:2px solid var(--bad);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.alert b{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:8px 2px}
.stats b{display:block;font-size:22px}
.h{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.h:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pri);margin-right:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;word-break:break-word}
.msg{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:14px;margin-top:10px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.sw input{width:22px;height:22px}
details{border-bottom:1px solid var(--line);padding:8px 0}details:last-child{border:0}
summary{cursor:pointer;font-weight:500}
details p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.opt.c2{grid-template-columns:repeat(2,1fr)}
.h span:last-child{text-align:right}
.bub{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:92%;font-size:15px;white-space:pre-wrap;word-break:break-word}
.bub.u{background:var(--pri);color:#fff;margin-left:auto}
.bub.a{background:var(--bg);border:1px solid var(--line)}
#chLog{max-height:340px;overflow-y:auto;padding:2px}
.sq{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sq button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.cr{display:flex;gap:8px;margin-top:8px}
.cr input{flex:1;min-width:0}
.cr button{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.cmp th{background:var(--bg);font-weight:700}
.pl{display:grid;gap:8px;margin-top:8px}
.pl a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--bg);font-size:15px}
.pl a span{color:var(--pri);font-size:13px;white-space:nowrap}
.rec{background:var(--soft);border-radius:12px;padding:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;z-index:9}
#toast.show{opacity:1}
.hide{display:none}
.sy{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.syh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 2px;font-weight:600;font-size:16px;z-index:1}.syh span{flex:1;text-align:center}
.syh button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.sys{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;max-width:460px;margin-left:auto;margin-right:auto}
.sys h3{margin:0 0 12px;font-size:15px;font-weight:700}
.syg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.syg button{border:0;background:none;color:var(--ink);font:inherit;font-size:11.5px;line-height:1.2;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0}
.syg i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:26px;border:2.5px solid transparent}
.syg button.on i{border-color:var(--pri)}.syg button.on{font-weight:700;color:var(--pri)}
.sysv{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.sysv button{display:block;width:100%;max-width:428px;margin:0 auto;border:0;background:linear-gradient(90deg,#ff8fb5,#ff4f86);color:#fff;border-radius:99px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#au{margin:-4px -16px 0}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#d81b60,#ff6f9f);color:#fff;text-align:center;padding:30px 20px 64px;border-radius:0 0 36px 36px}
.hero i{position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}.b1{width:150px;height:150px;left:-40px;top:-50px}.b2{width:110px;height:110px;right:-25px;bottom:10px}
.ht{font-size:34px;font-weight:700;line-height:1.1}.hs{opacity:.9;font-size:15px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:-40px 16px 0;padding:18px;position:relative;box-shadow:0 10px 30px rgba(216,27,96,.18)}
.af{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:0 12px;margin-top:10px}
.af:focus-within{border-color:var(--pri)}.af input{border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;width:100%;outline:0}
.al2{display:flex;justify-content:space-between;margin:6px 0 2px}.lk{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px 2px}.lk.c{display:block;margin:10px auto 0}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.sys details{border-bottom:1px solid var(--line);padding:8px 0}.sys details:last-child{border:0}.sys details p{margin:6px 0 0;font-size:13.5px;color:var(--mute)}.sys details b{color:var(--ink)}

/* v11 pro skin */
:root{--bg:#fff6f8;--ink:#2b1220;--mute:#85606f;--pri:#c8174f;--soft:#fde6ed;--line:#f6d8e2;--onpri:#fff;--r:22px;--g:linear-gradient(135deg,#d81b60,#ff5f94);--sh:0 1px 2px rgba(120,20,60,.05),0 12px 28px -12px rgba(190,30,90,.22);--glow:rgba(255,143,181,.35);--disp:"Fraunces","Hind Madurai",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onpri:#2a0f1a;--sh:0 12px 28px -14px rgba(0,0,0,.7);--glow:rgba(255,107,157,.14)}}
:root[data-theme="dark"]{--onpri:#2a0f1a;--sh:0 12px 28px -14px rgba(0,0,0,.7);--glow:rgba(255,107,157,.14)}
body{background:radial-gradient(800px 380px at 90% -60px,var(--glow),transparent 62%),radial-gradient(520px 320px at -10% 38%,var(--glow),transparent 62%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;margin:0 -16px 12px;padding:10px 16px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.brand{font-family:var(--disp);font-size:30px;letter-spacing:-.5px}
.lang{border:0;background:var(--card);box-shadow:var(--sh);padding:3px}.lang button{border-radius:99px;padding:5px 13px;transition:.2s}.lang button.on{background:var(--g);box-shadow:0 4px 10px -3px rgba(216,27,96,.5)}
.hi{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1.15;margin:10px 0 12px}
.chips button{border:0;box-shadow:var(--sh);padding:7px 15px;font-weight:500;color:var(--mute);transition:.15s}.chips button:hover,.chips button:active{color:var(--pri);transform:translateY(-1px)}
.card{border:0;border-radius:var(--r);padding:22px 18px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;animation:rise .5s both}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#ff9ec0,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.2px;margin:0 0 10px}
.big,.timer{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--pri)}.timer{font-size:30px}
.pill{border:1px solid var(--line);font-weight:600;padding:3px 13px}
label{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
input[type=text],input[type=date],input[type=tel],input[type=email],.pk,.af{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding-top:11px;padding-bottom:11px;transition:.15s}
.af{padding-top:0;padding-bottom:0}.pk{padding:0}
input:focus,.af:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--soft);outline:0}
.opt button,.mc button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-weight:500;transition:.15s}
.opt button.on,.mc button.on{border-color:var(--pri);background:var(--pri);color:var(--onpri);box-shadow:0 6px 14px -6px rgba(216,27,96,.6)}
.cta{background:var(--g);border-radius:16px;padding:14px;letter-spacing:.2px;box-shadow:0 10px 20px -10px rgba(216,27,96,.7);transition:.15s}.cta:active{transform:scale(.98)}
.cta.alt{background:var(--card);color:var(--pri);border:1.5px solid var(--line);box-shadow:none;font-weight:600}
.stats div{background:var(--soft);border-radius:16px;padding:12px 2px}.stats b{font-family:var(--disp);font-size:26px;color:var(--pri)}
.bub.u{background:var(--g);border-bottom-right-radius:4px}.bub.a{background:var(--soft);border:0;border-bottom-left-radius:4px}
.msg{background:var(--soft);border:1px dashed var(--pri);border-radius:14px}
.pl a{background:var(--card);border:1.5px solid var(--line);border-radius:14px;transition:.15s}.pl a:hover{border-color:var(--pri)}
.rec{border-left:4px solid var(--pri);border-radius:6px 14px 14px 6px}
.alert{border-width:1.5px;border-radius:14px;background:color-mix(in srgb,var(--bad) 8%,transparent)}
.cmp th{background:var(--soft)}.sys{border-radius:22px;box-shadow:var(--sh)}
.hero{background:radial-gradient(circle at 82% 0,#ff9ec0,transparent 55%),linear-gradient(150deg,#b3123f,#e8336f 62%,#ff7aa8)}
.ht{font-family:var(--disp);font-size:42px;letter-spacing:-1px}
.acard{border:0;box-shadow:var(--sh)}
#toast{border-radius:99px;padding:10px 20px}
@media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}
.rep{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--pri);border-radius:6px 16px 16px 6px;padding:11px 14px;margin-top:10px;font-size:14px}.rep .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px;font-size:12.5px;color:var(--mute)}.rep .rh b{color:var(--pri);font-size:14px}
</style>

tIss:["தலைவலி: தண்ணீர் குடியுங்கள், அமைதியான இருட்டான அறையில் ஓய்வெடுங்கள், உணவைத் தவிர்க்காதீர்கள்.","குமட்டல்: இஞ்சி டீ குடியுங்கள், சிறிய இலகுவான உணவு சாப்பிடுங்கள். திரவம் தங்கவில்லை என்றால் மருத்துவரைப் பாருங்கள்.","தலைசுற்றல்: உட்காருங்கள் அல்லது படுத்துக்கொள்ளுங்கள், ORS குடியுங்கள், ஏதாவது சாப்பிடுங்கள். மீண்டும் வந்தால் அல்லது மயங்கினால் மருத்துவரைப் பாருங்கள்.","முதுகுவலி: வெந்நீர் ஒத்தடம், சிறிய நீட்சி பயிற்சிகள்.","சோர்வு: இரும்புச்சத்து உணவு, 8 மணிநேர தூக்கம், சிறிய ஓய்வு.","மனநிலை மாற்றம்: சிறிய நடை, பாடல் கேளுங்கள், நம்பிக்கையானவரிடம் பேசுங்கள். டீ, காபியைக் குறையுங்கள்.","வயிறு உப்புசம்: உப்பு குறைவு, சூடான தண்ணீர், சீரகம் அல்லது இஞ்சி தண்ணீர், இலகுவான உணவு.","வயிற்றுப்போக்கு: ORS, தயிர் சாதம், வாழைப்பழம். 2 நாட்களுக்கு மேல் நீடித்தால் மருத்துவரைப் பாருங்கள்.","காய்ச்சல்: ஓய்வு, திரவங்கள். காய்ச்சல் நீடித்தால் அல்லது பலவீனம் இருந்தால் மருத்துவரைப் பாருங்கள்."],
tUse:["நாப்கின்: 4 முதல் 6 மணிநேரத்திற்கு ஒருமுறை மாற்றுங்கள். சுற்றி குப்பைத் தொட்டியில் போடுங்கள், கழிவறையில் போடாதீர்கள்.","மென்ஸ்ட்ரூவல் கப்: 6 முதல் 10 மணிநேரத்திற்கு ஒருமுறை காலி செய்து, சுத்தமான தண்ணீரில் கழுவி மீண்டும் வையுங்கள். மாதவிடாய் முடிந்ததும் கப்பை கொதிக்க வையுங்கள்.","டாம்பன்: 4 முதல் 8 மணிநேரத்திற்கு ஒருமுறை மாற்றுங்கள், 8 மணிநேரத்திற்கு மேல் வேண்டாம். தேவைக்கு குறைந்த உறிஞ்சும் திறன் கொண்டதைப் பயன்படுத்துங்கள்.","துணி நாப்கின்: 4 மணிநேரத்திற்கு ஒருமுறை மாற்றுங்கள், சோப்பு போட்டு துவைத்து வெயிலில் நன்கு காயவையுங்கள்."],
